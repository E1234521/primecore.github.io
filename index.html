<section id="quote" class="py-24 bg-slate-50">
    <div class="max-w-4xl mx-auto px-6">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
            <div class="md:w-1/3 bg-blue-600 p-10 text-white">
                <h2 class="text-2xl font-bold mb-6">Partner With Us</h2>
                <p class="text-blue-100 text-sm mb-8">Select your specific requirements below for an accurate quote.</p>
                <div class="flex items-center gap-3 text-sm">
                    <i data-lucide="mail" size="18"></i>
                    <span>quotes@primecore.com</span>
                </div>
            </div>
            <div class="md:w-2/3 p-10">
                <form id="quoteForm" action="https://formspree.io/f/xojybewq" method="POST" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Email Address</label>
                            <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Quantity Needed</label>
                            <input type="number" name="quantity" min="1" value="1" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Category</label>
                            <select id="categorySelect" name="category" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                                <option value="">Select Category</option>
                                <option value="construction">Construction Materials</option>
                                <option value="electronics">Electronics</option>
                                <option value="chemicals">Chemicals / Janitorial</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Specific Item</label>
                            <select id="itemSelect" name="item" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" disabled>
                                <option value="">Choose Category First</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Additional Notes</label>
                        <textarea name="message" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" placeholder="Special delivery instructions or bulk sizing..."></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-slate-800 transition">Send Quote Request</button>
                    <p id="formStatus" class="text-center text-sm mt-2 hidden font-medium"></p>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
    lucide.createIcons();

    // 1. DATA FOR DROPDOWNS
    const inventory = {
        construction: ["Bulk Lumber", "Steel Reinforcements", "Concrete Additives", "Scaffolding"],
        electronics: ["Keyboards & Mice", "Semiconductors", "Fiber Optic Cabling", "Server Rack Units"],
        chemicals: ["Industrial Solvents", "Janitorial Supplies", "Specialty Cleaning Agents", "Safety Reagents"]
    };

    const categorySelect = document.getElementById('categorySelect');
    const itemSelect = document.getElementById('itemSelect');

    // 2. LOGIC TO UPDATE ITEMS BASED ON CATEGORY
    categorySelect.addEventListener('change', function() {
        const selected = this.value;
        
        // Clear previous options
        itemSelect.innerHTML = '<option value="">Select Item</option>';
        
        if (selected && inventory[selected]) {
            itemSelect.disabled = false;
            inventory[selected].forEach(item => {
                const option = document.createElement('option');
                option.value = item;
                option.textContent = item;
                itemSelect.appendChild(option);
            });
        } else {
            itemSelect.disabled = true;
            itemSelect.innerHTML = '<option value="">Choose Category First</option>';
        }
    });

    // 3. FORM SUBMISSION LOGIC
    const form = document.getElementById('quoteForm');
    const status = document.getElementById('formStatus');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Sending...";
        status.classList.add('hidden');

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            });
            
            if (response.ok) {
                status.textContent = "Success! Quote request sent.";
                status.className = "text-center text-sm mt-2 block text-green-600 font-bold";
                form.reset();
                itemSelect.disabled = true;
                btn.textContent = "Sent Successfully";
            } else {
                throw new Error();
            }
        } catch (err) {
            status.textContent = "Network error. Please try again.";
            status.className = "text-center text-sm mt-2 block text-red-500";
            btn.disabled = false;
            btn.textContent = "Send Quote Request";
        }
    });
</script>
